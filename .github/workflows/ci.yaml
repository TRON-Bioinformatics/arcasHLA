name: Continuous integration tasks
on: [push]

jobs:
  lint:
    runs-on: "ubuntu-24.04"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          environments: dev
          cache: true
          pixi-version: v0.78.0
      - run: pixi run lint
  tests:
    runs-on: "ubuntu-24.04"
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          cache: true
          pixi-version: v0.78.0
      - run: pixi run test
